<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>你的名字 | 个人主页</title>
  <style>
    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 860px; margin: 48px auto; padding: 0 16px; line-height: 1.6;}
    header{margin-bottom: 28px;}
    .card{padding:16px 18px; border:1px solid #e5e7eb; border-radius:12px; margin: 12px 0;}
    a{color:#2563eb; text-decoration:none;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <header>
    <h1>你的名字</h1>
    <p>一句话自我介绍：方向 / 学校 / 城市 / 兴趣</p>
    <p>
      <a href="https://github.com/你的用户名">GitHub</a> ·
      <a href="mailto:you@example.com">邮箱</a> ·
      <a href="https://www.linkedin.com/in/xxx">LinkedIn</a>
    </p>
  </header>

  <section class="card">
    <h2>作品 / 项目</h2>
    <ul>
      <li><a href="https://github.com/你的用户名/项目1">项目1</a>：一句话说明你做了什么</li>
      <li><a href="https://github.com/你的用户名/项目2">项目2</a>：一句话说明亮点</li>
    </ul>
  </section>

  <section class="card">
    <h2>关于我</h2>
    <p>这里写一段 3～6 句话的简介：你擅长什么、正在做什么、想找什么合作/机会。</p>
  </section>
</body>
</html>
